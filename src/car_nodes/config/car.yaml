/**/plan_node:
  ros__parameters:
    server_wait: 10.0
    step_timeout: 180.0
    cancel_wait: 10.0
    vision_model_wait: 60.0

/**/base_node:
  ros__parameters:
    motor_port: ""
    speed: 150.0
    turn_speed: 150.0
    turn_radius: 0.3
    turn_track_width: 0.41
    turn_spin_speed: 150.0
    align_spin_speed: 150.0
    align_rate_src: "auto"
    vision_lookahead: "0.5"
    vision_dir_sign: 1.0
    vision_model_wait: 60.0
    meters_per_count: 0.00016029
    straight_kp_gap: 0.30
    straight_ki_gap: 0.20
    straight_kd_gap: 0.45

/**/sensor_node:
  ros__parameters:
    imu_port: ""
    # 与 base_node 的 motor_port 一致，用于自动识别时排除电机串口。
    motor_port: ""

/**/arm_node:
  ros__parameters:
    arm_port: ""
    arm_speed: 10.0
    servo_port: ""

/**/vision_node:
  ros__parameters:
    device: "0"
    infer_device: "cpu"
    enable_objects: true
    scan_timeout: 30.0
    observe_timeout: 10.0
    observe_stable_frames: 3
    target_min_area_ratio: 0.001
    publish_hz: 25.0
