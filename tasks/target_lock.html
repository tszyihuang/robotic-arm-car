<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>标靶跟踪 · 瞄准点矫正</title>
<style>
*{box-sizing:border-box}body{background:#10151e;color:#e8edf6;font:16px system-ui;margin:0;padding:24px;max-width:1200px;margin:auto}
h1{font-size:24px;margin:0 0 12px}p{line-height:1.6}.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0}
button{background:#284b80;color:white;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}input{width:92px;padding:8px;border:1px solid #48607f;border-radius:6px;background:#1a2332;color:inherit;font:inherit}
#stage{position:relative;width:100%;aspect-ratio:16/9;background:#05080d;border-radius:12px;overflow:hidden;cursor:crosshair;touch-action:manipulation}
#view,#overlay{width:100%;height:100%;position:absolute;inset:0}#view{display:block}#overlay{pointer-events:none}
#status,#coordinates{font-variant-numeric:tabular-nums}#message{min-height:24px;color:#ffdb70}.hint{color:#a8b7ce;font-size:14px}
svg line,svg rect,svg circle{vector-effect:non-scaling-stroke}#box{fill:none;stroke:#6ee7aa;stroke-width:2}#cross{stroke:#ffdb70;stroke-width:2;fill:none}
@media(max-width:600px){body{padding:12px}button{padding:10px 12px}}
</style>
</head>
<body>
<h1>标靶跟踪 · 瞄准点矫正</h1>
<p class="hint">点击画面设置黄色瞄准点，已锁定标靶会对准这里。绿色框表示锁定标靶；虚线表示画面中心。</p>
<p id="status" role="status">等待画面…</p>
<div id="stage">
 <img id="view" alt="实时摄像头画面">
 <svg id="overlay" viewBox="0 0 1280 720" aria-hidden="true">
  <g stroke="#fff" opacity=".3" stroke-dasharray="5 5"><line id="center-x"/><line id="center-y"/></g>
  <rect id="box" style="display:none"/>
  <g id="cross"><circle id="ring" r="13"/><line id="aim-x"/><line id="aim-y"/></g>
 </svg>
</div>
<p id="coordinates">瞄准点：等待画面尺寸…</p>
<div class="bar">
 <label>横向偏移 <input id="offset-x" type="number" step="0.1" value="0"> px</label>
 <label>纵向偏移 <input id="offset-y" type="number" step="0.1" value="0"> px</label>
 <button id="apply" data-frame>应用偏移</button>
</div>
<div class="bar">
 <label>微调步长 <input id="step" type="number" min="0.1" max="1000" step="0.1" value="2"> px</label>
 <button data-dx="-1" data-dy="0" data-frame>← 左</button>
 <button data-dx="1" data-dy="0" data-frame>右 →</button>
 <button data-dx="0" data-dy="-1" data-frame>↑ 上</button>
 <button data-dx="0" data-dy="1" data-frame>下 ↓</button>
</div>
<div class="bar"><button id="reset">恢复画面中心</button><button id="save">保存校正</button><span id="saved"></span></div>
<p class="hint">偏移以画面中心为零点，向右、向下为正。调整立即用于跟踪；点击“保存校正”后，下次启动自动加载。恢复中心后也需保存才能覆盖旧校正。</p>
<p id="message" role="status" aria-live="polite"></p>
<script>
const $=id=>document.getElementById(id);
let state=null,busy=false;
const clamp=value=>Math.min(1,Math.max(0,value));
function attrs(id,values){for(const [key,value] of Object.entries(values))$(id).setAttribute(key,value);}
function draw(){
 if(!state)return;
 const size=state.size||[1280,720],[w,h]=size,aim=state.aim,x=aim.x*w,y=aim.y*h;
 $('stage').style.aspectRatio=`${w} / ${h}`;
 attrs('overlay',{viewBox:`0 0 ${w} ${h}`});
 attrs('center-x',{x1:w/2,y1:0,x2:w/2,y2:h});attrs('center-y',{x1:0,y1:h/2,x2:w,y2:h/2});
 attrs('ring',{cx:x,cy:y});attrs('aim-x',{x1:x-23,y1:y,x2:x+23,y2:y});attrs('aim-y',{x1:x,y1:y-23,x2:x,y2:y+23});
 $('box').style.display=state.target?'':'none';
 if(state.target){const [x1,y1,x2,y2]=state.target.box;attrs('box',{x:x1*w,y:y1*h,width:(x2-x1)*w,height:(y2-y1)*h});}
 if(state.size){
  $('coordinates').textContent=`瞄准点：(${x.toFixed(1)}, ${y.toFixed(1)}) px · 相对中心：横向 ${((aim.x-.5)*w).toFixed(1)} px，纵向 ${((aim.y-.5)*h).toFixed(1)} px`;
  for(const [id,value] of [['offset-x',(aim.x-.5)*w],['offset-y',(aim.y-.5)*h]]){
   if(document.activeElement!==$(id))$(id).value=value.toFixed(1);
  }
 }
 $('saved').textContent=aim.dirty?'有未保存的调整':'当前校正未更改';
 controls();
}
function controls(){for(const button of document.querySelectorAll('button'))button.disabled=busy||(button.hasAttribute('data-frame')&&!state?.size);}
async function action(path,body,message){
 if(busy)return;
 busy=true;controls();
 try{
  const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await response.json();if(!response.ok)throw Error(data.error);
  if(state)state.aim=data.aim;draw();$('message').textContent=message;
 }catch(error){$('message').textContent=error.message;}finally{busy=false;controls();}
}
function setAim(x,y){return action('/api/aim',{x,y},'瞄准点已调整，将在下一个新画面用于跟踪。');}
$('stage').onpointerdown=event=>{
 if(!state?.size||busy||event.button!==0)return;
 const box=$('stage').getBoundingClientRect();setAim(clamp((event.clientX-box.left)/box.width),clamp((event.clientY-box.top)/box.height));
};
$('apply').onclick=()=>{
 const [w,h]=state.size,x=$('offset-x').valueAsNumber,y=$('offset-y').valueAsNumber;
 if(!Number.isFinite(x)||!Number.isFinite(y)){ $('message').textContent='请输入有效的像素偏移。';return; }
 setAim(.5+x/w,.5+y/h);
};
for(const button of document.querySelectorAll('[data-dx]'))button.onclick=()=>{
 const step=$('step').valueAsNumber;if(!Number.isFinite(step)||step<=0){$('message').textContent='微调步长必须大于 0。';return;}
 const [w,h]=state.size;setAim(clamp(state.aim.x+Number(button.dataset.dx)*step/w),clamp(state.aim.y+Number(button.dataset.dy)*step/h));
};
$('reset').onclick=()=>action('/api/aim/reset',{},'瞄准点已恢复画面中心。');
$('save').onclick=()=>action('/api/aim/save',{},'校正已保存，下次启动自动加载。');
const view=$('view');let retry;
view.onerror=()=>{clearTimeout(retry);retry=setTimeout(()=>{view.src='/stream.mjpg?t='+Date.now();},1000);};
view.src='/stream.mjpg';
async function refresh(){
 try{
  const response=await fetch('/api/status');const data=await response.json();if(!response.ok)throw Error(data.error);
  if(!busy){state=data;draw();}
  const stale=data.image_age===null||data.image_age>.6;
  $('status').textContent=data.error|| (stale?'等待摄像头新画面…':data.state);
  view.style.opacity=stale?'.45':'1';
 }catch(error){$('status').textContent='连接中断：'+error.message;}
 setTimeout(refresh,300);
}
controls();refresh();
</script>
</body>
</html>
